name: Update Pleiades data and deploy

on:
  schedule:
    - cron: "13 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r maintenance/requirements.txt

      - name: Refresh Pleiades data
        run: python maintenance/etl_pleiades.py --fresh

      - name: Export browser data
        run: python maintenance/export_pleiades.py

      - name: Run maintenance tests
        run: python -m pytest tests/maintenance

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4